version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: apex_lms_db
    environment:
      POSTGRES_DB: apex_lms
      POSTGRES_USER: apex_admin
      POSTGRES_PASSWORD: securepassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: apex_lms_redis
    ports:
      - "6379:6379"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_lms_backend
    command: gunicorn apps.core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://apex_admin:securepassword123@db:5432/apex_lms
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=production-secret-lms-apex-9023
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_lms_celery_worker
    command: celery -A apps.core worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://apex_admin:securepassword123@db:5432/apex_lms
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_lms_celery_beat
    command: celery -A apps.core beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://apex_admin:securepassword123@db:5432/apex_lms
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    container_name: apex_lms_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  postgres_data:
