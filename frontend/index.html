    <meta charset="UTF-8" />

    <title>Hadescore Apex &amp; Technologies</title>

    <!-- Early protection: runs before any bundle -->
    <script>
      // © 2026 HadesCore Technologies – Proprietary
      document.documentElement.classList.remove('dark');
      localStorage.removeItem('theme');

      // Block right-click early
      document.addEventListener('contextmenu', function(e) {
        var t = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (t !== 'input' && t !== 'textarea') e.preventDefault();
      }, true);

      // Block F12, Ctrl+Shift+I, Ctrl+U early
      document.addEventListener('keydown', function(e) {
        var ctrl = e.ctrlKey || e.metaKey;
        if (
          e.key === 'F12' ||
          (ctrl && e.shiftKey && 'ijcIJC'.indexOf(e.key) >= 0) ||
          (ctrl && (e.key === 'u' || e.key === 'U'))
        ) {
          e.preventDefault(); e.stopPropagation();
        }
      }, true);
    </script>

    <style>
      /* Prevent text selection on non-editable content */
      body { -webkit-user-select: none; user-select: none; }
      input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
      /* Prevent drag on images and links */
      img, a { -webkit-user-drag: none; user-drag: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
