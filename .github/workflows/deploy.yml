name: Continuous Integration & Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-state: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Django Tests
      env:
        DJANGO_SECRET_KEY: test-key-123
        DJANGO_DEBUG: True
      run: |
        python backend/manage.py test backend/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Web Application Container
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: hadescore-apex-lms-web:latest

    - name: Build Frontend Application Container
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: false
        tags: hadescore-apex-lms-frontend:latest
